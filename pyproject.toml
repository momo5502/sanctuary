[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctuary-agents"
version = "0.1.0"
description = "Orchestrate AI agents in isolated containers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
sanctuary-mcp = "sanctuary.mcp_server:main"
sanctuary-service = "sanctuary.service:main"

[tool.setuptools.packages.find]
include = ["sanctuary*"]
